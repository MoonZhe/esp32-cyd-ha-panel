  # ============================================================
  # ORIENTATION / LAYOUT
  # Uncomment ONE preset block below, comment out the others.
  # Touch calibration values (TOUCH_CAL_*) are device-specific —
  # portrait/flipped values are approximate and may need tuning.
  #
  # LVGL_ROTATION (0/90/180/270) drives the rotation — LVGL rotates both the
  # display output and the touch coordinates (ESPHome 2026.4+). DISPLAY_W/H are
  # the *logical* (post-rotation) canvas size used by the tile layout below;
  # the physical panel is always driven at its native 240×320 (see display:).
  #
  # Tile content layout:
  #   Landscape — icon left, title + value to its right
  #   Portrait  — icon centered on top, title + value stacked below
  # ============================================================

  # ----- 0° — Landscape 320×240 (default, USB on right) -----
  # ORIENTATION: "0"
  # DISPLAY_W: "320"
  # DISPLAY_H: "240"
