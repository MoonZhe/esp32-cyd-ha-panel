  TILE1_ENTITY: "automation.button_trigger_dim_lights"   # main Home Assistant entity for this tile
  TILE1_STATE_ENTITY: "automation.button_trigger_dim_lights" # entity used for active/inactive state styling
  TILE1_TITLE: "Cozy"                              # tile title shown in the UI
  TILE1_ICON: "\U000F04B9"                         # mdi:sofa — also add to MDI_GLYPH_* list above if not already there
  TILE1_TYPE: "script"                             # tile type: light | fan | switch | scene | script | cover | climate
  TILE1_TAP_ACTION: "activate"                     # tap action: auto | toggle | activate | fan_toggle_preset | custom
  TILE1_LONGPRESS: "none"                          # long press mode: none | slider | action
  TILE1_VALUE_MODE: "text"                         # value mode: auto | brightness | percentage | preset | text
  TILE1_LABEL_OFF: "Disabled"                      # text shown when entity is off
  TILE1_LABEL_ON: "On"                             # text shown for text-mode tiles when entity is on

  # --- colors ---
  TILE1_CIRCLE_ACTIVE_COLOR: "0xFEC600"            # icon circle color when active
