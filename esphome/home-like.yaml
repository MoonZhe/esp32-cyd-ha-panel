# Two SPI buses used by the CYD:
# - lcd: built-in display
# - my_touchscreen: built-in touch controller
spi:
  - id: lcd
    clk_pin: GPIO14
    mosi_pin: GPIO13

  - id: my_touchscreen
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    pin: GPIO21
    id: gpio_backlight_pwm

  - platform: ledc
    id: output_red
    pin: GPIO4
    inverted: true
  - platform: ledc
    id: output_green
    pin: GPIO16
    inverted: true
  - platform: ledc
    id: output_blue
    pin: GPIO17
    inverted: true

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: "Power Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

  - platform: rgb
    name: LED
    red: output_red
    id: led
    green: output_green
    blue: output_blue
    restore_mode: ALWAYS_OFF

# Touchscreen configuration (XPT2046)
# IMPORTANT:
# - calibration values are device-specific
# - Since ESPHome 2026.4 LVGL manages rotation (see `rotation:` in the lvgl
#   block) and rotates touch coordinates automatically. The transform below is
#   therefore NOT a per-orientation rotation — it only corrects the raw XPT2046
#   axis orientation against the panel's native (portrait) frame and stays the
#   same for every ORIENTATION preset.
touchscreen:
  platform: xpt2046
  id: ts_touch
  spi_id: my_touchscreen
  cs_pin: 33
  interrupt_pin: 36
  update_interval: 20ms
  threshold: 300

  calibration:
    x_min: ${TOUCH_CAL_X_MIN}
    x_max: ${TOUCH_CAL_X_MAX}
    y_min: ${TOUCH_CAL_Y_MIN}
    y_max: ${TOUCH_CAL_Y_MAX}

  transform:
    swap_xy: ${TOUCH_SWAP_XY}
    mirror_x: ${TOUCH_MIRROR_X}
    mirror_y: ${TOUCH_MIRROR_Y}

  on_touch:
    - lambda: |-
        id(last_touch_ms) = millis();
    - if:
        condition:
          lambda: 'return id(display_dimmed) || id(display_deep_dimmed);'
        then:
          - script.execute: wake_display

# Display configuration (ST7789V — USB-C CYD revision; was ILI9341, garbled on this unit)
display:
  - platform: mipi_spi
    id: my_display
    spi_id: lcd
    model: ESP32-2432S028-7789
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false
    # This model's default SPI clock is 40MHz, whose harmonics (2400/2440MHz)
    # land inside the WiFi 2.4GHz band - a documented self-interference issue
    # on this exact board. Lowering it is a common community mitigation for
    # WiFi instability that isn't explained by the router or power supply.
    data_rate: 20MHz

    # Native panel dimensions (portrait). Do NOT swap these per orientation and
    # do NOT add a display transform — rotation is handled by LVGL below.
    # ESPHome 2026.6+ rejects a swapped transform here with "Invalid offsets".
    dimensions:
      width: 240
      height: 320

lvgl:
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: ts_touch

  # LVGL owns the rotation (display + touch) since ESPHome 2026.4.
  rotation: ${LVGL_ROTATION}

  style_definitions:
    - id: style_tile
      bg_color: 0x1F2228
      bg_opa: COVER
      radius: 14
      border_width: 1
      border_color: 0x2C3038
      pad_left: 8
      pad_right: 8
      pad_top: 8
      pad_bottom: 8
      shadow_width: 0
      shadow_opa: 40%

    - id: style_tile_disabled
      bg_color: 0x939391
      bg_opa: 95%
      radius: 18
      border_width: 0
      pad_left: 8
      pad_right: 8
      pad_top: 8
      pad_bottom: 8
      shadow_width: 0
      shadow_opa: 25%

    # Icons sit directly on the tile now - the circle is only a layout box.
    - id: style_icon_circle
      bg_color: 0xFEC600
      bg_opa: TRANSP
      radius: 999
      border_width: 0

    - id: style_icon_circle_disabled
      bg_color: 0x7B7B6F
      bg_opa: 95%
      radius: 999
      border_width: 0

    - id: style_room
      text_font: headline
      text_color: 0xFFFFFF
      text_opa: 100%

    - id: style_time
      text_font: time_label
      text_color: 0xF2F2F4
      text_opa: 100%

    - id: style_title
      text_font: label
      text_color: 0x000000
      text_opa: 100%

    - id: style_value
      text_font: sublabel
      text_color: 0x7A7A7C
      text_opa: 100%

    - id: style_value_big
      text_font: sublabel_big
      text_color: 0xFFFFFF
      text_opa: 80%

    - id: style_title_disabled
      text_font: label
      text_color: 0xFFFFFF
      text_opa: 100%

    - id: style_value_disabled
      text_font: sublabel
      text_color: 0xD9D9D9
      text_opa: 100%

  pages:
    - id: home_page
      bg_color: 0x121418
      bg_opa: COVER
      scrollable: false
      scrollbar_mode: 'OFF'
      widgets:
        - tileview:
            id: main_tileview
            x: 0
            y: 0
            bg_color: 0x121418
            bg_opa: COVER
            width: ${DISPLAY_W}
            height: ${DISPLAY_H}
            scrollable: false
            tiles:
              - id: tile_ha
                row: 0
                column: 0
                dir: HOR
                scrollable: false
                scrollbar_mode: 'OFF'
                widgets:
                  - label:
                      id: lbl_room
                      align: TOP_RIGHT
                      x: -9
                      y: 9
                      text: "${ROOM_NAME}"
                      text_font: sublabel_big
                      text_color: 0xC8CBD2

                  # Room temperature from the Bedroom AC, or "Offline" in red
                  # while Home Assistant is disconnected (set in ui_refresh).
                  - label:
                      id: lbl_room_temp
                      align: TOP_RIGHT
                      x: -9
                      y: 28
                      text: ""
                      text_font: sublabel
                      text_color: 0x8A8F98

                  # Two separate dots: WiFi link state (left) and HA API
                  # connection state (right) - so "WiFi up but HA down" is
                  # distinguishable from both being down. Updated by wifi:
                  # on_connect/on_disconnect and api: on_client_connected/
                  # on_client_disconnected respectively.
                  - label:
                      id: lbl_wifi_status
                      align: TOP_MID
                      x: -16
                      y: ${HEADER_Y}
                      text: "\U000F05A9"
                      text_font: materialdesign_icons
                      text_color: 0xE74C3C

                  - label:
                      id: lbl_ha_status
                      align: TOP_MID
                      x: 16
                      y: ${HEADER_Y}
                      text: "\U000F02DC"
                      text_font: materialdesign_icons
                      text_color: 0xE74C3C

                  - label:
                      id: lbl_time
                      align: TOP_LEFT
                      x: 9
                      y: 6
                      text: ""
                      styles: style_time

                  # ---------- TILE 1 ----------
                  - obj:
                      id: tile1
                      x: ${GRID_COL1_X}
                      y: ${GRID_ROW1_Y}
                      width: ${TILE_W}
                      height: ${TILE_H}
                      styles: style_tile
                      pressed:
                        bg_opa: 65%
                        border_width: 2
                        border_color: 0xFEC600
                      scrollable: false
                      scrollbar_mode: 'OFF'
                      widgets:
                        - obj:
                            id: tile1_icon_circle
                            x: ${TILE_ICON_X}
                            y: ${TILE_ICON_Y}
                            width: 36
                            height: 36
                            styles: style_icon_circle
                            clickable: false
                            scrollable: false
                            scrollbar_mode: 'OFF'
                            widgets:
                              - label:
                                  id: tile1_icon_lbl
                                  align: CENTER
                                  text_font: materialdesign_icons
                                  text_color: 0xFFFFFF
                                  text: "${TILE1_ICON}"
                                  clickable: false
                        - label:
                            id: t1_title
                            x: ${TILE_TITLE_X}
                            y: ${TILE_TITLE_Y}
                            text: "${TILE1_TITLE}"
                            styles: style_title
                            clickable: false
                        - label:
                            id: t1_value
                            x: ${TILE_VALUE_X}
                            y: ${TILE_VALUE_Y}
                            text: "—"
