script:
  # Spotify's own cover is ~250 KB - bigger than the largest free heap block,
  # and online_image buffers the whole download. Home Assistant's camera proxy
  # scales the JPEG down server-side (width=120 -> ~160 px, ~10 KB), which fits.
  - id: fetch_album_art
    mode: restart
    then:
      - lambda: 'id(album_art_ready) = false;'
      - script.execute: ui_refresh
      # Give HA a moment to switch entity_picture to the new track.
      - delay: 1s
      - lambda: |-
          std::string state = id(ha_state_tile6).state;
          std::string token = id(album_art_camera_token).state;
          if ((state != "playing" && state != "paused") || token.empty()) return;
          std::string url = std::string("${HA_BASE_URL}/api/camera_proxy/${SPOTIFY_ART_CAMERA}?token=") + token + "&width=160&height=160";
          id(tile6_album_art).set_url(url.c_str());
          id(tile6_album_art).update();

  - id: wake_display
    mode: restart
    then:
      - lambda: |-
          id(last_touch_ms) = millis();
          id(display_dimmed) = false;
          id(display_deep_dimmed) = false;
      - light.turn_on:
          id: back_light
          brightness: !lambda "return atoi(\"${MAX_BRIGHTNESS}\") / 100.0f;"
      - lvgl.widget.hide: dim_wake_overlay
      - lvgl.widget.hide: color_detail_overlay
      - lvgl.widget.hide: climate_detail_overlay

  - id: dim_display
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return std::string("${AUTO_DIM}") == "true";'
          then:
            - lambda: |-
                int dim_value = atoi("${DIM_BRIGHTNESS}");
                int max_value = atoi("${MAX_BRIGHTNESS}");

                if (std::string("${NIGHT_MODE}") == "true") {
                  auto now = id(homeassistant_time).now();
                  int hour = now.hour;
                  int start_hour = atoi("${NIGHT_START_HOUR}");
                  int end_hour = atoi("${NIGHT_END_HOUR}");
                  bool is_night = false;
                  if (start_hour < end_hour) {
                    is_night = (hour >= start_hour && hour < end_hour);
                  } else {
                    is_night = (hour >= start_hour || hour < end_hour);
                  }
                  if (is_night) {
                    dim_value = atoi("${NIGHT_DIM_BRIGHTNESS}");
                  }
                }

                id(back_light).turn_on().set_brightness(dim_value / 100.0f).perform();

                // Always mark as dimmed to stop the interval from re-firing
                id(display_dimmed) = true;
                // Only show the touch-blocking overlay when brightness actually changes
                if (dim_value < max_value) {
                  lv_obj_clear_flag(id(dim_wake_overlay), LV_OBJ_FLAG_HIDDEN);
                }

  - id: deep_dim_display
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return std::string("${DEEP_DIM}") == "true";'
          then:
            - lambda: |-
                int min_value = atoi("${MIN_BRIGHTNESS}");
                id(back_light).turn_on().set_brightness(min_value / 100.0f).perform();

                // Mark as deep-dimmed to stop the interval from re-firing
                id(display_deep_dimmed) = true;
                lv_obj_clear_flag(id(dim_wake_overlay), LV_OBJ_FLAG_HIDDEN);

