          condition:
            lambda: 'return std::string("${DIRECT_ACTIONS}") == "true";'
          then:
            # HVAC mode is tile 4's job (input_select.hvac_selector) - tile 5
            # only adjusts temperature now, no mode/fan calls here.
            - homeassistant.action:
