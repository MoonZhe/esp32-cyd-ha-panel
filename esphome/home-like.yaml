    size: 28
    glyphs:
      - "${MDI_GLYPH_1}"
      - "${MDI_GLYPH_2}"
      - "${MDI_GLYPH_3}"
      - "${MDI_GLYPH_4}"
      - "${MDI_GLYPH_5}"
      - "${MDI_GLYPH_6}"
      - "\U000F012C" # check
      - "\U000F02DC" # mdi:home (HA API status icon)
      - "\U000F05A9" # mdi:wifi (WiFi link status icon)
      - "${SPOTIFY_ICON_PLAY}"
      - "${SPOTIFY_ICON_PAUSE}"
      - "${SPOTIFY_ICON_PREV}"
      - "${SPOTIFY_ICON_NEXT}"

  # Small icon font for the long-press hint dots in the tile corner.
  - file: 'fonts/materialdesignicons-webfont.ttf'
    id: mdi_small
    size: 16
    glyphs:
      - "\U000F01D8" # mdi:dots-horizontal
      - "\U000F057E" # mdi:volume-high (Spotify volume indicator)
      - "\U000F0581" # mdi:volume-off (Spotify muted indicator)

http_request:

online_image:
  - id: tile6_album_art
    url: "https://via.placeholder.com/120x160"       # placeholder - real URL is set at runtime via set_url() (Task 2's tile6_entity_picture sensor)
    format: JPEG
    type: RGB565
    resize: 160x160
    # Default download buffer is 64 KB, reserved at boot - that alone left no
    # contiguous block for the 29 KB decoded cover. HA serves ~3-7 KB JPEGs, and
    # the buffer grows to the Content-Length if one is ever larger.
    buffer_size: 8192
    on_download_finished:
      - lambda: 'id(album_art_ready) = true;'
      # The widget was created before any image existed (0x0), so point it
      # at the image again to pick up the new size and pixels.
      - lvgl.image.update:
          id: spotify_overlay_art
          src: tile6_album_art
      - script.execute: ui_refresh
    on_error:
      - lambda: 'id(album_art_ready) = false;'
      - logger.log:
          format: "DIAG album art download failed - uptime=%u heap=%u"
          args: [ 'millis()', 'ESP.getFreeHeap()' ]

sensor:
  # TEMP DIAGNOSTIC - remove once the drop cause is confirmed (see debug:
  # component above). Frequent RSSI polling + free heap lets us correlate a
  # drop with a signal dip (RF issue) vs a heap crater (memory leak/crash).
  - platform: wifi_signal
    name: "Diag Wifi Signal"
    id: diag_wifi_signal
    update_interval: 5s

  - platform: debug
    id: diag_free_heap
    free:
      name: "Diag Heap Free"

  - platform: wifi_signal
    name: "Wifi Signal"
    update_interval: 600s

  - platform: uptime
    name: "Uptime"
    id: uptime_s
    update_interval: 15s

  - platform: homeassistant
    id: tile1_brightness
    entity_id: ${TILE1_ENTITY}
    attribute: brightness
    on_value: { then: [ script.execute: ui_refresh ] }

  - platform: homeassistant
    id: tile1_percentage
    entity_id: ${TILE1_ENTITY}
    attribute: percentage
    on_value: { then: [ script.execute: ui_refresh ] }

  - platform: homeassistant
    id: tile2_brightness
    entity_id: ${TILE2_ENTITY}
    attribute: brightness
    on_value: { then: [ script.execute: ui_refresh ] }

