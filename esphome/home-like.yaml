    id: tile6_entity_picture
    entity_id: ${TILE6_ENTITY}
    attribute: entity_picture
    # entity_picture changes on every track change (its cache= param), so this
    # is the "new track" signal. The art itself comes from the camera below.
    on_value:
      then:
        - script.execute: fetch_album_art

  # Access token of the Generic Camera that mirrors the Spotify cover. It
  # rotates every few minutes; we only need the current one when fetching.
  # (The camera's own entity_picture can keep a stale entity_id after a
  # rename, so the proxy path is built from the configured entity instead.)
  - platform: homeassistant
    id: album_art_camera_token
    entity_id: ${SPOTIFY_ART_CAMERA}
    attribute: access_token
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(album_art_ready);'
            then:
              - script.execute: fetch_album_art

